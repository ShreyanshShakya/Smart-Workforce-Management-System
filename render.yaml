services:
  - type: web
    name: wms-backend
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /v3/api-docs
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*" # Change this to your Vercel URL once deployed
